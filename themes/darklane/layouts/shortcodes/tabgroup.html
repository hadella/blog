{{- $id := .Get "id" | default (printf "tabs-%d" now.Unix) -}}

<div class="tab-group" id="{{ $id }}" style="margin: 2rem 0">
    <div
        class="tab-buttons"
        style="
            display: flex;
            gap: 0.5rem;
            border-bottom: 2px solid #1a1f26;
            margin-bottom: 1rem;
        "
    >
        <!-- Tab buttons will be generated by JavaScript -->
    </div>
    <div class="tab-content">{{ .Inner }}</div>
</div>

<script>
    (function () {
        const tabGroup = document.getElementById("{{ $id }}");
        const buttons = tabGroup.querySelector(".tab-buttons");
        const content = tabGroup.querySelector(".tab-content");
        const tabs = content.querySelectorAll(".tab-pane");

        // Generate tab buttons
        tabs.forEach((tab, index) => {
            const title = tab.getAttribute("data-title") || `Tab ${index + 1}`;
            const btn = document.createElement("button");
            btn.textContent = title;
            btn.className = "tab-btn";
            btn.style.cssText =
                "background: #11151c; border: none; color: #888; padding: 0.75rem 1.5rem; cursor: pointer; border-bottom: 2px solid transparent; transition: all 0.2s;";

            if (index === 0) {
                btn.style.color = "#39BAE6";
                btn.style.borderBottomColor = "#39BAE6";
                tab.style.display = "block";
            } else {
                tab.style.display = "none";
            }

            btn.addEventListener("click", () => {
                // Deactivate all tabs
                buttons.querySelectorAll(".tab-btn").forEach((b) => {
                    b.style.color = "#888";
                    b.style.borderBottomColor = "transparent";
                });
                tabs.forEach((t) => (t.style.display = "none"));

                // Activate clicked tab
                btn.style.color = "#39BAE6";
                btn.style.borderBottomColor = "#39BAE6";
                tab.style.display = "block";
            });

            btn.addEventListener("mouseenter", () => {
                if (btn.style.color !== "rgb(57, 186, 230)") {
                    btn.style.color = "#C678DD";
                }
            });

            btn.addEventListener("mouseleave", () => {
                if (btn.style.color !== "rgb(57, 186, 230)") {
                    btn.style.color = "#888";
                }
            });

            buttons.appendChild(btn);
        });
    })();
</script>
